# fly.toml app configuration file generated for consorcio-api on 2026-04-19T22:19:09-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Keep one machine ready in GRU. The frontend proxies uploads to this service;
# a cold start can otherwise make Vercel's upstream TLS connection time out and
# surface as a 502 ROUTER_EXTERNAL_TARGET_HANDSHAKE_ERROR to the user.
#

app = 'consorcio-api'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
min_machines_running = 1
  processes = ['app']

[mounts]
  source = 'consorcio_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
